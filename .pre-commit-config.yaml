# Bloqueo local de secretos (Shift-Left).
# Cada integrante debe ejecutar una vez:  pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect-secrets (bloquear credenciales)
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^(venv/|\.venv/|data/)
